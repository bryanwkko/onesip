<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자몽 에이드 - 여름 신메뉴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
    @font-face { font-family: 'Pretendard'; src: local('Pretendard'); }
    body { margin: 0; }
</style>
</head>
<body>
<div style="max-width:480px;margin:0 auto;min-height:100vh;background:#FFF8F3;font-family:'Pretendard',-apple-system,sans-serif;color:#3A2A20;box-shadow:0 0 40px rgba(0,0,0,0.06);position:relative;overflow:hidden">

  <div style="position:relative;width:100%;aspect-ratio:4/5">
    <img src="assets/images/69d582ec.jpg" alt="자몽 에이드" style="width:100%;height:100%;object-fit:cover;display:block">
    <div style="position:absolute;inset:0;background:linear-gradient(to top, rgba(58,26,16,0.55) 0%, rgba(58,26,16,0.05) 35%, rgba(58,26,16,0) 60%)"></div>
    <div style="position:absolute;top:20px;left:20px;background:rgba(255,255,255,0.9);padding:6px 14px;border-radius:100px;font-size:13px;font-weight:600;color:#D9552B;letter-spacing:0.02em">NEW MENU</div>
    <div style="position:absolute;bottom:24px;left:24px;right:24px;color:#fff">
      <div style="font-size:15px;font-weight:500;opacity:0.9;margin-bottom:4px">여름 신메뉴</div>
      <div style="font-family:'Gowun Batang',serif;font-size:40px;font-weight:700;line-height:1.15;text-shadow:0 2px 12px rgba(0,0,0,0.25)">자몽 에이드</div>
    </div>
  </div>

  <div style="padding:28px 24px 16px">
    <p style="margin:0;font-size:16px;line-height:1.7;color:#5C4636">직접 짠 자몽 생과즙에 탄산의 청량함을 더한 여름 시그니처 에이드. 새콤달콤한 자몽 과육이 그대로 씹혀요.</p>
  </div>

  <div style="padding:8px 24px 20px;display:flex;gap:8px;flex-wrap:wrap">
    <span style="background:#FDEBE0;color:#C24A22;font-size:13px;font-weight:600;padding:6px 12px;border-radius:100px">생과즙 100%</span>
    <span style="background:#FDEBE0;color:#C24A22;font-size:13px;font-weight:600;padding:6px 12px;border-radius:100px">상큼달콤</span>
    <span style="background:#FDEBE0;color:#C24A22;font-size:13px;font-weight:600;padding:6px 12px;border-radius:100px">여름 시그니처</span>
  </div>

  <div style="margin:0 20px 24px;background:#fff;border-radius:20px;padding:22px 20px;box-shadow:0 4px 20px rgba(210,120,70,0.08);border:1px solid #F5E4D8">
    <div style="font-size:14px;font-weight:700;color:#D9552B;letter-spacing:0.06em;margin-bottom:14px">PRICE</div>
    <div style="display:flex;flex-direction:column;gap:0">
      <div style="display:flex;align-items:baseline;justify-content:space-between;padding:14px 0;border-bottom:1px solid #F2E5D9">
        <div style="display:flex;align-items:baseline;gap:8px">
          <span style="font-size:17px;font-weight:600;color:#3A2A20">Regular</span>
          <span style="font-size:13px;color:#B08A6E">355ml</span>
        </div>
        <span style="font-size:19px;font-weight:800;color:#3A2A20">4,500원</span>
      </div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;padding:14px 0;border-bottom:1px solid #F2E5D9">
        <div style="display:flex;align-items:baseline;gap:8px">
          <span style="font-size:17px;font-weight:600;color:#3A2A20">Large</span>
          <span style="font-size:13px;color:#B08A6E">473ml</span>
        </div>
        <span style="font-size:19px;font-weight:800;color:#3A2A20">5,500원</span>
      </div>
    </div>
  </div>

  <div style="margin:0 20px 32px;padding:18px 20px;background:#FBF1E7;border-radius:16px">
    <div style="font-size:13px;font-weight:700;color:#A87858;letter-spacing:0.06em;margin-bottom:10px">CUSTOM OPTION</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span style="background:#fff;color:#5C4636;font-size:13px;font-weight:500;padding:7px 13px;border-radius:100px;border:1px solid #EAD9C8">당도 조절</span>
      <span style="background:#fff;color:#5C4636;font-size:13px;font-weight:500;padding:7px 13px;border-radius:100px;border:1px solid #EAD9C8">샷 추가</span>
      <span style="background:#fff;color:#5C4636;font-size:13px;font-weight:500;padding:7px 13px;border-radius:100px;border:1px solid #EAD9C8">제로 탄산</span>
    </div>
  </div>

  <div style="padding:20px 24px 32px;text-align:center;border-top:1px solid #F0E1D3">
    <div style="font-size:14px;font-weight:700;color:#3A2A20;letter-spacing:0.02em">카페 오월</div>
    <div style="font-size:12px;color:#B08A6E;margin-top:4px">주문은 카운터에서 도와드릴게요</div>
  </div>
</div>
</body>
</html>
